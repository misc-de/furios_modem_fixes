#
# Defect 20: the phone boots with no signal icon and grey bars.
#
# ModemManager.service is ofono2mm here, and ofono2mm's own drop-in declares
# Requires=ofono.service without an After=. Requires says "ofono has to be
# running too"; only After= says "and before me". So systemd starts both at
# once, while oFono spends its ExecStartPre in binder-wait for the Android
# radio HAL - nine seconds on this phone, and however long it takes on a
# colder one.
#
# ofono2mm waits ten seconds for a modem before it takes the bus name anyway,
# because a phone with no ModemManager at all is worse than one with an empty
# ModemManager. Measured 14.9. 13:27: ofono2mm started at :45, gave up
# waiting at :57, phosh enumerated an empty ObjectManager at :59, and oFono
# finished at :28:02. phosh draws the signal icon from what it finds at that
# one enumeration and nothing later changes its mind - which is precisely why
# taking the name early is a last resort and not a plan.
#
# Ordering it after oFono makes the ten-second wait what it was written to
# be: the net under a phone with no SIM and no modem coming, instead of the
# normal path of every cold boot.
[Unit]
After=ofono.service
