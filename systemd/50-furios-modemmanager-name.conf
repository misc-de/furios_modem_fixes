#
# Defect 23: the phone boots with no signal icon and grey bars.
#
# What systemd is told, and why it matters. Upstream ModemManager.service is
# Type=dbus with BusName=org.freedesktop.ModemManager1: the unit counts as
# started at the moment the name is on the bus, and anything ordered after it
# can rely on that. ofono2mm's own drop-in (10-ofono2mm.conf) replaces the
# ExecStart and sets Type=simple, which throws that contract away - systemd
# then calls the service started as soon as the process is forked. On the
# boot of 14.9. 14:50 that was 14:51:37.5, and the name did not appear until
# 14:51:42.1. For four and a half seconds systemd, modemctl and every
# ordering dependency believed in a ModemManager that no client could reach.
#
# It is also how defect 17 stayed hidden for a whole boot: ofono2mm was
# `active (running)`, its event loop turning, and nobody owned the name.
# Type=dbus turns that into a failed start after TimeoutStartSec (5 s here),
# which is a thing that can be seen and restarted.
#
# What this drop-in no longer does: order ModemManager after oFono. That was
# defect 20's fix, and it was built on the belief that a client enumerates
# once when the name appears and never looks again - so the name had to wait
# for a modem, and the wait had to be kept off the normal path. The belief is
# wrong; three measurements on this phone are in FINDINGS.md, defect 23, and
# ofono2mm no longer waits. Ordering it after oFono now only does harm: oFono
# spends nine seconds in binder-wait for the Android radio HAL, phosh starts
# three seconds before that ends, and the session's shell asked a bus name
# that nobody owned yet.
[Service]
Type=dbus
BusName=org.freedesktop.ModemManager1
