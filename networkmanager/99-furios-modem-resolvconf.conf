#
# FuriOS ships dns=dnsmasq with rc-manager=resolvconf (auto), and
# /usr/sbin/resolvconf is a symlink to resolvectl. NetworkManager calls it with
# "NetworkManager" as the interface name, which resolvectl cannot resolve, so
# every network change ends in:
#
#   resolvconf[...]: Failed to resolve interface "NetworkManager": No such device
#   dns-mgr: could not commit DNS changes: resolvconf failed with status 256
#
# The effect is not the log noise. NetworkManager fills its own dnsmasq on
# 127.0.0.1 correctly - including the carrier's servers the moment Wi-Fi goes
# away - but is never allowed to write the resolv.conf that points at it.
# /etc/resolv.conf points at systemd-resolved's stub instead, and that stub
# only ever learns Wi-Fi's servers. A correctly filled resolver runs unused
# beside an empty one, and with Wi-Fi off not a single name resolves.
#
# rc-manager=symlink takes resolvconf out of the path: NetworkManager writes
# /run/NetworkManager/resolv.conf and owns the symlink at /etc/resolv.conf.
#
# Numbered above 99-furios-backend.conf on purpose - conf.d is read in
# alphabetical order and the later file wins, so a FuriOS update to that file
# cannot quietly take this back.
[main]
rc-manager=symlink
