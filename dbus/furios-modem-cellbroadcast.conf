<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- ModemManager 1.24 added org.freedesktop.ModemManager1.Modem.CellBroadcast
     and a polkit action to guard it, but its bus policy never grew a matching
     <allow>. The <deny send_destination="org.freedesktop.ModemManager1"
     send_type="method_call"/> at the top of that policy therefore rejects
     every call on the interface before polkit is ever consulted - including
     cellbroadcastd's SetChannels, which is how the emergency alert channel
     list reaches the modem. Nothing else shows: the modem stays registered,
     data flows, and the only trace is one rejected message in the journal.

     Upstream has since added three rules to conf.polkit (List for everyone,
     Delete and SetChannels behind polkit); 1.24.2 as shipped here has none of
     them. Those rules live in context="default" because ModemManager checks
     polkit afterwards. ofono2mm does not check polkit at all, so copying them
     verbatim would hand the channel list to every local account. Grant it to
     the group that already owns the modem instead: ofono2mm's own drop-in
     gives group "radio" the whole Modem interface, and cellbroadcastd runs as
     a member of it. The interface is granted whole because all three of its
     methods are needed; CBM objects carry properties only and are already
     readable.

     When a ModemManager update brings the upstream rules, this file is
     redundant - "modemctl status" says so, and "modemctl revert" takes it
     away. -->
<busconfig>
  <policy group="radio">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"/>
  </policy>
</busconfig>
