<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- ModemManager 1.24 added org.freedesktop.ModemManager1.Modem.CellBroadcast
     and a polkit action to guard it, but its bus policy never grew a matching
     <allow>. The <deny send_destination="org.freedesktop.ModemManager1"
     send_type="method_call"/> at the top of that policy therefore rejects
     every call on the interface before polkit is ever consulted - including
     cellbroadcastd's SetChannels, which is how the emergency alert channel
     list reaches the modem. Nothing else shows: the modem stays registered,
     data flows, and the only trace is one rejected message in the journal.

     Upstream has since added three rules to conf.polkit (List for everyone,
     Delete and SetChannels behind polkit); 1.24.2 as shipped here has none of
     them. Those rules live in context="default" because ModemManager checks
     polkit afterwards. ofono2mm does not check polkit at all, so copying them
     verbatim would hand the channel list to every local account.

     Granted to group "radio" instead, and only the two methods that are
     actually called. cellbroadcastd is a user session service - it runs as the
     person using the phone, so there is no service account to narrow to - and
     the symbols in its binary are mm_modem_cell_broadcast_set_channels_sync
     and mm_modem_cell_broadcast_list. It never calls Delete, so Delete is not
     granted. CBM objects carry properties only and are already readable.

     Worth being honest about what this does and does not protect. The file
     that matters is not this one: ofono2mm ships
     /usr/share/dbus-1/system.d/org.freedesktop.ModemManager1.conf, which gives
     group "radio" the WHOLE org.freedesktop.ModemManager1.Modem interface -
     Enable, SetPowerState, Command, FactoryReset, Reset - with no polkit check
     anywhere behind it. Anything that could abuse the two methods below
     already holds that. Narrowing here costs nothing and keeps this file out
     of the problem; it does not solve it.

     If a future cellbroadcastd does start calling Delete it will be refused,
     and the bus says so in the journal ("Rejected send message"). That is the
     line to look for before assuming the daemon is at fault.

     When a ModemManager update brings the upstream rules, this file is
     redundant - "modemctl status" says so, and "modemctl revert" takes it
     away. -->
<busconfig>
  <policy group="radio">
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="SetChannels"/>
    <allow send_destination="org.freedesktop.ModemManager1"
           send_interface="org.freedesktop.ModemManager1.Modem.CellBroadcast"
           send_member="List"/>
  </policy>
</busconfig>
